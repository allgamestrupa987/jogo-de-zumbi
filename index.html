<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apocalipse Zumbi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div>Vida: <span id="hp">100</span>%</div>
            <div>Fase: <span id="level">1</span>/5</div>
            <div>Arma: <span id="weapon-name">Pistola</span></div>
            <div>Inimigos: <span id="enemy-count">0</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="controls-info">
            Controles: <b>A / D</b> (Mover) | <b>Q / 1 / 2</b> (Trocar Arma) | <b>Clique do Mouse</b> (Atirar)
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
